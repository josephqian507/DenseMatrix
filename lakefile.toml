name = "provable_computation"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ProvableComputation"]
testDriver = "ProvableComputationTest"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "ProvableComputation"
# The active cleanup surface. Keep legacy function-backed Gaussian-elimination modules,
# examples, benchmarks, and the stale public facade out of the default build.
globs = [
  "ProvableComputation.LinearAlgebra.DenseMatrix.+",
  "ProvableComputation.LinearAlgebra.Matrix.+",
]

[[lean_lib]]
name = "ProvableComputationTest"
globs = ["ProvableComputationTest.+"]
leanOptions = { weak.linter.mathlibStandardSet = false }

[[lean_exe]]
name = "densematrix_bench"
root = "ProvableComputation.Bench.DenseMatrixBench"

[[lean_exe]]
name = "gaussian_dependency_graph"
root = "ProvableComputation.Tools.GaussianDependencyGraph"
